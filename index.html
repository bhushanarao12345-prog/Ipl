<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPL Live Score</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#202124;font-family:Arial,sans-serif}.top{background:#202124;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top button,.btn{background:#202124;color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700}.wrap{max-width:900px;margin:auto}.hero,.card,.admin{background:#fff;margin-top:8px;padding:16px}.live{color:#d9234f;font-size:12px;font-weight:800}.teams{display:flex;justify-content:space-between;text-align:center;align-items:center}.team{width:42%}.team h2{font-size:18px}.score{font-size:34px;font-weight:800}.sub{color:#6b7280;font-size:13px}.vs{color:#9ca3af}.tabs{background:#fff;margin-top:8px;border-bottom:1px solid #ddd}.tabs span{display:inline-block;padding:13px 18px;font-weight:700}.active{color:#d9234f;border-bottom:2px solid #d9234f}.title{background:#f8fafc;padding:11px;font-weight:800;font-size:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.balls{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.ball{width:35px;height:35px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700}.four{background:#dff5e5;color:#147a35}.six{background:#dcecff;color:#1657a6}.w{background:#ffe1e5;color:#b91c1c}.overbox{border-top:1px solid #eee;padding:13px 0}.overhead{display:flex;justify-content:space-between;font-weight:700}.small{color:#6b7280;font-size:12px}.admin{display:none}.admin.open{display:block}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.scorebtn{padding:14px 4px;border:0;border-radius:8px;background:#eef1f5;font-weight:800}.fourb{background:#dff5e5}.sixb{background:#dcecff}.wb{background:#ffe1e5;color:#b91c1c}.status{text-align:center;color:#16803c;font-size:13px;margin-top:10px}@media(max-width:600px){.score{font-size:29px}.controls{grid-template-columns:repeat(3,1fr)}} </style></head><body><header class="top"><b>🏏 IPL Live Score</b><button onclick="showLogin()">Admin</button></header><main class="wrap"><section class="hero"><div class="live">● LIVE</div><div class="teams"><div class="team"><h2 id="t1">Team 1</h2><div class="score" id="s1">0/0</div><div class="sub" id="o1">0.0 Overs</div></div><div class="vs">VS</div><div class="team"><h2 id="t2">Team 2</h2><div class="score">—</div><div class="sub">Yet to bat</div></div></div></section><div class="tabs"><span class="active">SCORECARD</span><span>COMMENTARY</span></div><section class="card"><div class="title">Batting</div><table class="table"><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr><tr><td>Striker *</td><td id="r">0</td><td id="b">0</td><td id="f4">0</td><td id="f6">0</td><td id="sr">0.00</td></tr></table></section><section class="card"><div class="title">Bowling</div><table class="table"><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>ER</th></tr><tr><td>Current Bowler</td><td id="bo">0.0</td><td id="br">0</td><td id="bw">0</td><td id="er">0.00</td></tr></table></section><section class="card"><div class="title">This Over</div><div class="balls" id="current"><span class="ball">—</span></div></section><section class="card"><div class="title">Over by Over</div><div id="history"><div class="small">No completed overs yet.</div></div></section><section class="card"><div class="title">Match Summary</div><div style="padding:13px;color:#4b5563" id="summary">Waiting for live score.</div></section><section class="admin" id="loginPanel"><h3>Admin Access</h3><input id="pw" type="password" placeholder="Password" style="width:100%;padding:12px"><div id="err" style="color:#c51f3b;min-height:20px"></div><button class="btn" onclick="login()">Enter</button></section><section class="admin" id="adminPanel"><h3>Live Scoring</h3><div class="controls"><button class="scorebtn" onclick="score(0,'0')">0</button><button class="scorebtn" onclick="score(1,'1')">1</button><button class="scorebtn" onclick="score(2,'2')">2</button><button class="scorebtn" onclick="score(3,'3')">3</button><button class="scorebtn fourb" onclick="score(4,'4')">4</button><button class="scorebtn sixb" onclick="score(6,'6')">6</button><button class="scorebtn" onclick="extra('Wd',true)">Wide</button><button class="scorebtn" onclick="extra('Nb',true)">No Ball</button><button class="scorebtn" onclick="extra('B',false)">Bye</button><button class="scorebtn" onclick="extra('Lb',false)">Leg Bye</button><button class="scorebtn wb" onclick="wicket()">Wicket</button><button class="scorebtn" onclick="undo()">Undo</button></div><button class="btn" onclick="logout()">Lock Admin</button><div class="status" id="saveStatus">Ready</div></section></main><script>const U='https://qzdbnohuskpjxccesoez.supabase.co',K='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn',A=U+'/rest/v1/cricket_score',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},PASS='admin123';let state={team1:'Team 1',team2:'Team 2',runs:0,wickets:0,balls:[],overs:[]};function showLogin(){loginPanel.classList.add('open');pw.focus()}function login(){if(pw.value===PASS){loginPanel.classList.remove('open');adminPanel.classList.add('open');pw.value='';err.textContent=''}else err.textContent='Incorrect password.'}function logout(){adminPanel.classList.remove('open')}function ballsToHtml(a){return (a.length?a:['—']).map(x=>'<span class="ball '+(x==='W'?'w ':'')+(x==='4'?'four ':'')+(x==='6'?'six':'')+'">'+x+'</span>').join('')}function render(s){t1.textContent=s.team1;t2.textContent=s.team2;s1.textContent=s.runs+'/'+s.wickets;o1.textContent=s.overs+' Overs';r.textContent=s.runs;let legal=s.balls.filter(x=>['0','1','2','3','4','6','W'].includes(x));b.textContent=legal.length;f4.textContent=s.balls.filter(x=>x==='4').length;f6.textContent=s.balls.filter(x=>x==='6').length;sr.textContent=legal.length?(s.runs/legal.length*100).toFixed(2):'0.00';bo.textContent=s.overs;br.textContent=s.runs;bw.textContent=s.wickets;er.textContent=Number(s.overs)?(s.runs/Number(s.overs)).toFixed(2):'0.00';current.innerHTML=ballsToHtml(s.balls);summary.textContent=s.runs+' runs for '+s.wickets+' wickets in '+s.overs+' overs.';history.innerHTML=s.oversHistory&&s.oversHistory.length?s.oversHistory.slice().reverse().map((o,i)=>'<div class="overbox"><div class="overhead"><span>Over '+o.number+'</span><span>'+o.runs+' runs</span></div><div class="balls">'+ballsToHtml(o.balls)+'</div></div>').join(''):'<div class="small">No completed overs yet.</div>'}function getState(){let p=s1.textContent.split('/');return{team1:t1.textContent,team2:t2.textContent,runs:+p[0],wickets:+p[1],overs:o1.textContent.split(' ')[0],balls:currentData(),oversHistory:state.oversHistory||[]}}function currentData(){return [...current.querySelectorAll('.ball')].map(x=>x.textContent).filter(x=>x!=='—')}function advance(legal){let p=o1.textContent.split(' ')[0].split('.'),o=+p[0],b=+p[1]+(legal?1:0);if(b===6){let arr=currentData();let total=arr.reduce((a,x)=>a+((x==='Wd'||x==='Nb')?1:(x==='B'||x==='Lb'||x==='W'||x==='0')?0:+x),0);state.oversHistory=[...(state.oversHistory||[]),{number:o+1,balls:arr,runs:total}];o++;b=0;current.innerHTML=''}o1.textContent=o+'.'+b+' Overs'}function score(n,label){let p=s1.textContent.split('/');s1.textContent=(+p[0]+n)+'/'+p[1];addCurrent(label);advance(true);save()}function addCurrent(x){let a=currentData();a.push(x);current.innerHTML=ballsToHtml(a)}function extra(x,legal){let p=s1.textContent.split('/');s1.textContent=(+p[0]+1)+'/'+p[1];addCurrent(x);advance(legal);save()}function wicket(){let p=s1.textContent.split('/');s1.textContent=p[0]+'/'+(+p[1]+1);addCurrent('W');advance(true);save()}function undo(){load()}async function save(){state.team1=t1.textContent;state.team2=t2.textContent;state.runs=+s1.textContent.split('/')[0];state.wickets=+s1.textContent.split('/')[1];state.overs=o1.textContent.split(' ')[0];state.balls=currentData();let body={team1:state.team1,team2:state.team2,runs:state.runs,wickets:state.wickets,overs:state.overs,ball_history:{current:state.balls,overs:state.oversHistory||[]},updated_at:new Date().toISOString()};try{let x=await fetch(A+'?id=eq.1',{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(body)});if(!x.ok)throw Error(await x.text());saveStatus.textContent='✓ Saved online'}catch(e){saveStatus.textContent='Save failed: '+e.message}}async function load(){try{let x=await fetch(A+'?id=eq.1&select=*',{headers:H}),a=await x.json();if(a[0]){let q=a[0],bh=q.ball_history||{current:[],overs:[]};state.oversHistory=bh.overs||[];let view={...q,balls:bh.current||[],oversHistory:state.oversHistory};render(view)}}catch(e){console.log(e)}}load();setInterval(load,5000);</script></body></html>
