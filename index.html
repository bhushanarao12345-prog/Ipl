<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPL Cricket Score</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.nav{height:64px;background:#ffffffdd;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.logo{font-weight:750;font-size:20px}.nav button,.btn{border:0;border-radius:999px;padding:12px 19px;background:#111;color:#fff;font-weight:650;cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:42px 20px 70px}.hero{text-align:center;padding:25px 10px 42px}.hero h1{font-size:clamp(45px,9vw,80px);letter-spacing:-.06em;margin:0}.hero p{color:#666;font-size:18px}.card,.panel{background:#fff;border-radius:28px;padding:28px;box-shadow:0 10px 35px #0000000d;margin-bottom:20px}.label{color:#16803c;font-weight:700;font-size:13px}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-top:24px}.team{text-align:center}.team h2{margin:0 0 8px;font-size:24px}.score{font-size:42px;font-weight:800}.sub{color:#777}.vs{color:#aaa;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{background:#fff;border-radius:22px;padding:22px}.stat b{font-size:30px;display:block;margin-top:6px}.muted{color:#777}.admin{display:none}.admin.open{display:block}.login{max-width:420px;margin:auto;text-align:center}.login input,.control input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:14px;font-size:16px;margin:10px 0}.error{color:#c62828;min-height:22px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.control{background:#f5f5f7;padding:18px;border-radius:18px}.control label{font-weight:650}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.secondary{background:#e5e5ea;color:#111}.status{text-align:center;color:#16803c;font-size:14px;margin-top:12px}.footer{text-align:center;color:#888;margin-top:35px;font-size:13px}@media(max-width:650px){.match{grid-template-columns:1fr}.vs{display:none}.stats,.controls{grid-template-columns:1fr}.card,.panel{padding:22px}}
</style></head><body>
<header class="nav"><div class="logo">🏏 IPL Score</div><button onclick="showLogin()">Admin</button></header><main class="wrap"><section class="hero"><h1>IPL Cricket.</h1><p>Live scores, simple and fast.</p></section>
<section class="card"><div class="label">● LIVE MATCH</div><div class="match"><div class="team"><h2 id="team1">Team 1</h2><div class="score" id="score1">0/0</div><div class="sub" id="overs1">0.0 overs</div></div><div class="vs">VS</div><div class="team"><h2 id="team2">Team 2</h2><div class="score" id="score2">—</div><div class="sub">Yet to bat</div></div></div></section><section class="stats"><div class="stat"><span class="muted">Runs</span><b id="runs">0</b></div><div class="stat"><span class="muted">Wickets</span><b id="wickets">0</b></div><div class="stat"><span class="muted">Overs</span><b id="overs">0.0</b></div></section>
<section class="panel admin" id="loginPanel"><div class="login"><h2>Admin Access</h2><p class="muted">Password only — no username.</p><input id="password" type="password" placeholder="Password" autocomplete="off"><div class="error" id="error"></div><button class="btn" onclick="login()">Enter</button></div></section>
<section class="panel admin" id="adminPanel"><h2>Score Control</h2><p class="muted">Update the score. It will be saved online for everyone.</p><div class="controls"><div class="control"><label>Team 1</label><input id="inTeam1" value="Team 1"></div><div class="control"><label>Team 2</label><input id="inTeam2" value="Team 2"></div><div class="control"><label>Runs</label><input id="inRuns" type="number" min="0" value="0"></div><div class="control"><label>Wickets</label><input id="inWickets" type="number" min="0" max="10" value="0"></div><div class="control"><label>Overs</label><input id="inOvers" value="0.0"></div></div><div class="actions"><button class="btn" onclick="updateScore()">Update Score</button><button class="btn secondary" onclick="logout()">Lock Admin</button></div><div class="status" id="saveStatus"></div></section><div class="footer">IPL Cricket Score · Testing Version</div></main>
<script>
const SUPABASE_URL='https://qzdbnohuskpjxccesoez.supabase.co';const SUPABASE_KEY='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn';const ADMIN_PASSWORD='admin123';const API=SUPABASE_URL+'/rest/v1/cricket_score';const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function showLogin(){document.getElementById('loginPanel').classList.add('open');document.getElementById('password').focus();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function login(){if(document.getElementById('password').value===ADMIN_PASSWORD){document.getElementById('loginPanel').classList.remove('open');document.getElementById('adminPanel').classList.add('open');document.getElementById('password').value='';document.getElementById('error').textContent=''}else document.getElementById('error').textContent='Incorrect password.'}
function logout(){document.getElementById('adminPanel').classList.remove('open')}
function render(s){document.getElementById('team1').textContent=s.team1;document.getElementById('team2').textContent=s.team2;document.getElementById('score1').textContent=s.runs+'/'+s.wickets;document.getElementById('overs1').textContent=s.overs+' overs';document.getElementById('runs').textContent=s.runs;document.getElementById('wickets').textContent=s.wickets;document.getElementById('overs').textContent=s.overs;document.getElementById('inTeam1').value=s.team1;document.getElementById('inTeam2').value=s.team2;document.getElementById('inRuns').value=s.runs;document.getElementById('inWickets').value=s.wickets;document.getElementById('inOvers').value=s.overs}
async function loadScore(){try{const res=await fetch(API+'?id=eq.1&select=*',{headers});if(!res.ok)throw new Error(await res.text());const rows=await res.json();if(rows[0])render(rows[0])}catch(e){console.error(e)}}
async function updateScore(){const data={team1:document.getElementById('inTeam1').value||'Team 1',team2:document.getElementById('inTeam2').value||'Team 2',runs:Number(document.getElementById('inRuns').value)||0,wickets:Number(document.getElementById('inWickets').value)||0,overs:document.getElementById('inOvers').value||'0.0',updated_at:new Date().toISOString()};const status=document.getElementById('saveStatus');status.textContent='Saving...';try{const res=await fetch(API+'?id=eq.1',{method:'PATCH',headers:{...headers,'Prefer':'return=representation'},body:JSON.stringify(data)});if(!res.ok)throw new Error(await res.text());const rows=await res.json();render(rows[0]||{...data,id:1});status.textContent='✓ Score saved online. Others can refresh to see it.'}catch(e){status.textContent='Could not save: '+e.message;console.error(e)}}
loadScore();setInterval(loadScore,10000);
</script></body></html>
