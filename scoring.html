<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPL Admin Scoring</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:Arial;color:#17202a}.top{background:#111827;color:#fff;padding:18px;font-weight:800}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #0001}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teamBtn{padding:14px;border:2px solid #ddd;border-radius:12px;background:#fff;font-weight:800}.teamBtn.active{border-color:#111827;background:#111827;color:#fff}.score{text-align:center;font-size:34px;font-weight:800;margin:10px 0}.over{text-align:center;color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.b{padding:17px 5px;border:0;border-radius:10px;background:#eef2f7;font-weight:800;font-size:17px}.four{background:#dcfce7}.six{background:#dbeafe}.extra{background:#fff7ed}.w{background:#fee2e2;color:#b91c1c}.save{background:#111827;color:white;padding:14px;border:0;border-radius:10px;width:100%;font-weight:800;margin-top:12px}.msg{text-align:center;color:#15803d}.small{font-size:13px;color:#6b7280;text-align:center}@media(max-width:450px){.teams{grid-template-columns:1fr}.score{font-size:30px}}
</style></head>
<body><div class="top">🏏 IPL — Admin Scoring</div><main class="wrap">
<div class="card" id="loginCard"><input id="password" type="password" placeholder="Admin password"><button class="save" onclick="login()">Unlock Scoring</button><p id="msg" class="msg"></p></div>
<div id="panel" style="display:none">
<div class="card"><input id="t1" value="Team 1"><input id="t2" value="Team 2"><p class="small">Select the team you want to score</p><div class="teams"><button class="teamBtn active" id="team1Btn" onclick="selectTeam(1)">Team 1</button><button class="teamBtn" id="team2Btn" onclick="selectTeam(2)">Team 2</button></div></div>
<div class="card"><div id="activeName" class="small">Team 1</div><div class="score" id="score">0/0</div><div class="over" id="over">0.0 overs</div></div>
<div class="card"><div class="grid"><button class="b" onclick="ball(0)">0</button><button class="b" onclick="ball(1)">1</button><button class="b" onclick="ball(2)">2</button><button class="b" onclick="ball(3)">3</button><button class="b four" onclick="ball(4)">4</button><button class="b six" onclick="ball(6)">6</button><button class="b extra" onclick="wide()">Wide</button><button class="b extra" onclick="noBall()">No Ball</button><button class="b" onclick="bye()">Bye</button><button class="b" onclick="legBye()">Leg Bye</button><button class="b w" onclick="wicket()">Wicket</button><button class="b" onclick="undo()">Undo</button></div><button class="save" onclick="save()">Save Score Online</button><p id="saveMsg" class="msg"></p></div>
</div></main>
<script>
const U='https://qzdbnohuskpjxccesoez.supabase.co',K='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn',P='admin123',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},A=U+'/rest/v1/cricket_score';
let active=1,s={1:{r:0,w:0,o:0,b:0},2:{r:0,w:0,o:0,b:0}},history=[];
function login(){if(password.value===P){panel.style.display='block';loginCard.style.display='none';load()}else msg.textContent='Incorrect password.'}
function selectTeam(n){active=n;team1Btn.classList.toggle('active',n===1);team2Btn.classList.toggle('active',n===2);render()}
function state(){return s[active]}
function snapshot(){return JSON.parse(JSON.stringify(s))}
function legalBall(){let x=state();x.b++;if(x.b===6){x.o++;x.b=0}}
function addHistory(){history.push(snapshot());if(history.length>50)history.shift()}
function ball(r){addHistory();state().r+=r;legalBall();render();save()}
function wide(){addHistory();state().r++;render();save()}
function noBall(){addHistory();state().r++;render();save()}
function bye(){addHistory();state().r++;legalBall();render();save()}
function legBye(){addHistory();state().r++;legalBall();render();save()}
function wicket(){addHistory();state().w++;legalBall();render();save()}
function undo(){if(history.length){s=history.pop();render();save()}}
function render(){let x=state();score.textContent=x.r+'/'+x.w;over.textContent=x.o+'.'+x.b+' overs';activeName.textContent=active===1?t1.value:t2.value;team1Btn.textContent=t1.value||'Team 1';team2Btn.textContent=t2.value||'Team 2'}
async function load(){try{let q=await fetch(A+'?id=eq.1&select=*',{headers:H}),a=await q.json();if(a[0]){let x=a[0];t1.value=x.team1||'Team 1';t2.value=x.team2||'Team 2';s[1]={r:Number(x.team1_runs)||0,w:Number(x.team1_wickets)||0,...parseOvers(x.team1_overs)};s[2]={r:Number(x.team2_runs)||0,w:Number(x.team2_wickets)||0,...parseOvers(x.team2_overs)};render()}}catch(e){saveMsg.textContent='Load failed'}}
function parseOvers(v){let p=String(v||'0.0').split('.');return{o:Number(p[0])||0,b:Number(p[1])||0}}
async function save(){try{let body={team1:t1.value,team2:t2.value,team1_runs:s[1].r,team1_wickets:s[1].w,team1_overs:s[1].o+'.'+s[1].b,team2_runs:s[2].r,team2_wickets:s[2].w,team2_overs:s[2].o+'.'+s[2].b,updated_at:new Date().toISOString()};let q=await fetch(A+'?id=eq.1',{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(body)});if(!q.ok)throw Error(await q.text());saveMsg.textContent='✓ Saved online'}catch(e){saveMsg.textContent='Save failed — run the database update SQL first'}}
render();
</script></body></html>
