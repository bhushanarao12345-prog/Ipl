<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPL Admin Scoring</title><style>body{margin:0;background:#f3f5f7;font-family:Arial;color:#17202a}.top{background:#111827;color:white;padding:18px;font-weight:800}.wrap{max-width:600px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #0001}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.b{padding:18px 5px;border:0;border-radius:10px;background:#eef2f7;font-weight:800;font-size:17px}.four{background:#dcfce7}.six{background:#dbeafe}.extra{background:#fff7ed}.w{background:#fee2e2;color:#b91c1c}.save{background:#111827;color:white;padding:14px;border:0;border-radius:10px;width:100%;font-weight:800;margin-top:12px}.score{font-size:36px;font-weight:800;text-align:center}.msg{text-align:center;color:#15803d}</style></head><body><div class="top">🏏 IPL — Admin Scoring</div><main class="wrap"><div class="card"><input id="password" type="password" placeholder="Admin password"><button class="save" onclick="login()">Unlock Scoring</button><p id="msg" class="msg"></p></div><div id="panel" style="display:none"><div class="card"><input id="t1" value="Team 1"><input id="t2" value="Team 2"><div class="score" id="score">0/0</div><p style="text-align:center" id="over">0.0 overs</p></div><div class="card"><div class="grid"><button class="b" onclick="ball(0,'0')">0</button><button class="b" onclick="ball(1,'1')">1</button><button class="b" onclick="ball(2,'2')">2</button><button class="b" onclick="ball(3,'3')">3</button><button class="b four" onclick="ball(4,'4')">4</button><button class="b six" onclick="ball(6,'6')">6</button><button class="b extra" onclick="extra('Wd')">Wide</button><button class="b extra" onclick="extra('Nb')">No Ball</button><button class="b" onclick="extra('B')">Bye</button><button class="b" onclick="extra('Lb')">Leg Bye</button><button class="b w" onclick="wicket()">Wicket</button><button class="b" onclick="undo()">Undo</button></div><button class="save" onclick="save()">Save Score Online</button><p id="saveMsg" class="msg"></p></div></div></main><script>const U='https://qzdbnohuskpjxccesoez.supabase.co/rest/v1/cricket_score',K='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn',P='admin123',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};let s={r:0,w:0,o:0,b:0};function login(){if(password.value===P){panel.style.display='block';password.parentElement.style.display='none';msg.textContent=''}}else msg.textContent='Incorrect password.'}function render(){score.textContent=s.r+'/'+s.w;over.textContent=Math.floor(s.o)+'.'+s.b+' overs'}function delivery(){s.b++;if(s.b===6){s.o++;s.b=0}}function ball(r){s.r+=r;delivery();render();save()}function extra(x){s.r++;if(x==='Wd'||x==='Nb'){}else delivery();render();save()}function wicket(){s.w++;delivery();render();save()}function undo(){s.b=s.b?s.b-1:(s.o>0?5:0);if(s.b===5&&s.o>0)s.o--;render()}async function save(){try{let q=await fetch(U+'?id=eq.1',{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({team1:t1.value,team2:t2.value,runs:s.r,wickets:s.w,overs:Math.floor(s.o)+'.'+s.b,updated_at:new Date().toISOString()})});if(!q.ok)throw Error(await q.text());saveMsg.textContent='✓ Saved online'}catch(e){saveMsg.textContent='Save failed'}}render()</script></body></html>
