<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Scoreboard</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{border:0;border-radius:12px;padding:13px 10px;font-size:17px;font-weight:700;background:#eee}button.on{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.danger{background:#fee}.status{font-weight:700;margin:8px 0}.score{font-size:30px;font-weight:800;margin:8px 0}</style></head><body><div class="wrap"><h1>Admin</h1><div id="login" class="card"><input id="pw" type="password" placeholder="Password"><button onclick="login()" style="width:100%;margin-top:10px">Enter</button></div><div id="app" hidden><div class="card"><input id="n1" placeholder="Team 1 name"><input id="n2" placeholder="Team 2 name" style="margin-top:8px"><button onclick="saveNames()" style="width:100%;margin-top:10px">Save Team Names</button></div><div class="card"><div class="grid"><button id="b1" class="on" onclick="team(1)">Team 1</button><button id="b2" onclick="team(2)">Team 2</button></div><div id="st" class="status"></div><div id="sc" class="score">0/0 • 0.0 Overs</div><div class="grid"><button onclick="add(0)">0</button><button onclick="add(1)">1</button><button onclick="add(2)">2</button><button onclick="add(3)">3</button><button onclick="add(4)">4</button><button onclick="add(6)">6</button><button onclick="add('W')">Wicket</button><button onclick="add('Wd')">Wide</button><button onclick="add('Nb')">No Ball</button><button onclick="add('B')">Bye</button><button onclick="add('Lb')">Leg Bye</button><button class="danger" onclick="undo()">Undo</button></div></div></div></div><script>const U='https://qzdbnohuskpjxccesoez.supabase.co',K='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn',A=U+'/rest/v1/cricket_score',H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json','Prefer':'return=minimal'};let T=1,S={1:{r:0,w:0,b:0},2:{r:0,w:0,b:0}},hist=[];function login(){if(pw.value==='admin123'){login.hidden=true;app.hidden=false;load()}else alert('Wrong password')}function team(n){T=n;b1.className=n===1?'on':'';b2.className=n===2?'on':'';render()}function overs(n){return Math.floor(n.b/6)+'.'+n.b%6}function render(){let x=S[T];st.textContent='Team '+T;sc.textContent=x.r+'/'+x.w+' • '+overs(x)+' Overs'}async function load(){try{let r=await fetch(A+'?id=eq.1&select=*',{headers:H}),a=await r.json();if(a[0]){let x=a[0];n1.value=x.team1||'Team 1';n2.value=x.team2||'Team 2';S[1]={r:x.team1_runs||0,w:x.team1_wickets||0,b:balls(x.team1_overs)};S[2]={r:x.team2_runs||0,w:x.team2_wickets||0,b:balls(x.team2_overs)};render()}}catch(e){alert('Could not load scoreboard')}}function balls(o){if(!o)return 0;let p=String(o).split('.');return (+p[0]||0)*6+(+p[1]||0)}async function save(){let p={team1:n1.value||'Team 1',team2:n2.value||'Team 2',team1_runs:S[1].r,team1_wickets:S[1].w,team1_overs:overs(S[1]),team2_runs:S[2].r,team2_wickets:S[2].w,team2_overs:overs(S[2]),updated_at:new Date().toISOString()};await fetch(A+'?id=eq.1',{method:'PATCH',headers:H,body:JSON.stringify(p)})}async function saveNames(){await save();alert('Saved')}function add(v){hist.push(JSON.stringify(S));let x=S[T];if(v==='W'){x.w++;x.b++}else if(v==='Wd'||v==='Nb'){x.r++;}else{x.r+=Number(v)||0;x.b++}render();save()}function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());render();save()}</script></body></html>
