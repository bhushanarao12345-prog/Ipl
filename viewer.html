<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL Live Score</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f6;color:#202124;font-family:Arial,Helvetica,sans-serif}
.top{background:#202124;color:#fff;padding:14px 18px;font-weight:800}
.wrap{max-width:700px;margin:auto;padding:10px}
.card{background:#fff;border-radius:14px;margin-top:10px;padding:22px 18px;box-shadow:0 2px 8px #00000012}
.live{color:#d9234f;font-size:12px;font-weight:800;margin-bottom:18px}
.team{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;border-bottom:1px solid #eee}
.team:last-child{border-bottom:0}
.name{font-size:19px;font-weight:800}
.right{text-align:right}
.score{font-size:32px;font-weight:800}
.overs{font-size:13px;color:#6b7280;margin-top:4px}
@media(max-width:600px){.score{font-size:28px}.name{font-size:17px}}
</style>
</head>
<body>
<div class="top">🏏 IPL Live Score</div>
<main class="wrap">
<section class="card">
<div class="live">● LIVE</div>
<div class="team">
<div class="name" id="t1">Team 1</div>
<div class="right"><div class="score" id="s1">0/0</div><div class="overs" id="o1">0.0 Overs</div></div>
</div>
<div class="team">
<div class="name" id="t2">Team 2</div>
<div class="right"><div class="score" id="s2">0/0</div><div class="overs" id="o2">0.0 Overs</div></div>
</div>
</section>
</main>
<script>
const U='https://qzdbnohuskpjxccesoez.supabase.co',K='sb_publishable_mBPe_QrjJu5vpSHRwaRYJw__LmORstn',A=U+'/rest/v1/cricket_score',H={apikey:K,Authorization:'Bearer '+K};
async function load(){try{let x=await fetch(A+'?id=eq.1&select=*',{headers:H}),a=await x.json();if(a[0]){let s=a[0];t1.textContent=s.team1;t2.textContent=s.team2;s1.textContent=s.runs+'/'+s.wickets;o1.textContent=s.overs+' Overs'}}catch(e){console.log(e)}}
load();setInterval(load,5000);
</script>
</body>
</html>
